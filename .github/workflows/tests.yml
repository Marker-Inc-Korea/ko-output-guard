name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional production backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ko-pii @ git+https://github.com/Marker-Inc-Korea/ko-pii.git@127f012a475bd013ba3301f470055b15d4b80ac4"
          python -m pip install "ko-prompt-guard @ git+https://github.com/Marker-Inc-Korea/ko-prompt-guard.git@cd72b21ad9c282fbd3d50723824575bb5090610b"
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Test
        run: python -m pytest

  quality:
    name: Static checks and distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality tools and optional backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ko-pii @ git+https://github.com/Marker-Inc-Korea/ko-pii.git@127f012a475bd013ba3301f470055b15d4b80ac4"
          python -m pip install "ko-prompt-guard @ git+https://github.com/Marker-Inc-Korea/ko-prompt-guard.git@cd72b21ad9c282fbd3d50723824575bb5090610b"
          python -m pip install ".[dev]" "build==1.5.0"
      - name: Static analysis
        run: |
          python -m ruff check src tests
          python -m mypy
      - name: Build distributions
        run: python -m build --sdist --wheel
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/ko-output-guard-wheel
          /tmp/ko-output-guard-wheel/bin/python -m pip install dist/*.whl
          /tmp/ko-output-guard-wheel/bin/python -c "import importlib.metadata as m, ko_output_guard; assert m.version('ko-output-guard') == ko_output_guard.__version__"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ko-output-guard-distributions
          path: dist/*
          if-no-files-found: error
