[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-output-guard"
version = "1.0.0"
description = "Deterministic Korean LLM output safety guard — secret/PII leak, unsafe-advice (MFDS), toxicity, prompt-leak"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marker Inc Korea" }]
keywords = ["korean", "llm", "output-guard", "safety", "pii", "secret", "guardrail", "mfds"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["pydantic>=2.0,<3"]

[project.urls]
Homepage = "https://github.com/Marker-Inc-Korea/ko-output-guard"
Repository = "https://github.com/Marker-Inc-Korea/ko-output-guard"
Issues = "https://github.com/Marker-Inc-Korea/ko-output-guard/issues"
Changelog = "https://github.com/Marker-Inc-Korea/ko-output-guard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pii = ["ko-pii>=1.15,<2"]
normalize = ["ko-prompt-guard>=1,<2"]  # 난독 출력 정규화(없으면 경량 fallback)
# Opt-in Tier-2: EmbeddingTier2 기본 bge-m3 백엔드. 코어는 ML-free(인코더 주입 가능).
embedding = ["torch>=2.0,<3", "transformers>=4.40,<6"]
dev = ["pytest>=8.0,<9", "ruff>=0.4,<1", "mypy>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
ko_output_guard = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/ko_output_guard/detectors/secret.py" = ["E501"]
"src/ko_output_guard/detectors/unsafe_advice.py" = ["E501"]
# Reviewer documentation and literal adversarial fixtures are intentionally dense.
"src/ko_output_guard/reviewers.py" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

# ko-pii / ko-prompt-guard 는 optional 의존성 — 미설치 환경에서도 타입체크가 통과해야.
[[tool.mypy.overrides]]
module = ["ko_pii", "ko_pii.*", "ko_prompt_guard", "ko_prompt_guard.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "transformers", "transformers.*"]
ignore_missing_imports = true
